spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/incidents-realm
          jwk-set-uri: http://localhost:8180/realms/incidents-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/