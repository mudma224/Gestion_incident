eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DEFAULT_APP_DB_URL:jdbc:postgresql://localhost:5432/incidents_db}
    username: ${POSTGRES_APP_USER:incidents_user}
    password: ${POSTGRES_APP_PASSWORD:incidents_pass}
